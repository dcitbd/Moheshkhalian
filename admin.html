<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এডমিন প্যানেল — মহেশখালীয়ান (Maheshkhalian)</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=6">
  <link rel="stylesheet" href="assets/css/admin.css?v=6">
</head>
<body class="admin-body">

  <!-- STEP 1: LOGIN SCREEN -->
  <div id="loginView" class="auth-wrap" style="display:none;">
    <div class="auth-card">
      <div style="text-align:center; margin-bottom:20px;">
        <div class="auth-logo-ring">
          <img src="assets/images/logo.png" alt="মহেশখালীয়ান লোগো">
        </div>
        <h2 style="color:var(--navy); font-size:1.5rem;">এডমিন প্যানেল লগইন</h2>
        <p style="font-size:0.88rem; color:var(--muted); margin-top:4px;">মহেশখালীয়ান (Maheshkhalian) • রোল-ভিত্তিক এক্সেস</p>
      </div>
      <div style="display:grid; gap:12px;">
        <input type="email" id="loginEmail" class="form-control" placeholder="ইমেইল ঠিকানা">
        <input type="password" id="loginPass" class="form-control" placeholder="পাসওয়ার্ড">
        <button class="btn btn-primary" style="width:100%; padding:12px;" onclick="doAdminLogin()">
          <i class="fa-solid fa-right-to-bracket"></i> লগইন করুন
        </button>
      </div>
      <div style="text-align:center; margin-top:16px;">
        <a href="index.html" style="font-size:0.9rem; color:var(--primary); font-weight:700;">
          <i class="fa-solid fa-arrow-left"></i> মূল ওয়েবসাইটে ফিরুন
        </a>
      </div>
    </div>
  </div>

  <!-- STEP 2: TIME LOCK SCREEN -->
  <div id="timelockView" class="auth-wrap" style="display:none;">
    <div class="auth-card" style="text-align:center;">
      <div class="kpi-icon kpi-emerald" style="margin:0 auto 14px; width:64px; height:64px; border-radius:20px;">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 style="color:var(--navy);">সিকিউরিটি টাইম লক</h2>
      <p style="font-size:0.88rem; color:var(--muted); margin-top:4px;">স্বাগতম, <strong id="tlUserName"></strong>! ড্যাশবোর্ডে প্রবেশ করতে পিন দিন।</p>
      <div class="timelock-clock" id="tlClock">00:00:00</div>
      <input type="password" id="tlPinInput" class="form-control" placeholder="টাইম লক পিন" style="text-align:center; font-size:1.2rem; letter-spacing:6px; margin-bottom:14px;">
      <button class="btn btn-primary" style="width:100%; padding:12px;" onclick="verifyTimeLock()">
        <i class="fa-solid fa-unlock-keyhole"></i> আনলক ও ড্যাশবোর্ড খুলুন
      </button>
      <button class="btn btn-outline btn-sm" style="margin-top:12px;" onclick="doAdminLogout()">লগআউট</button>
    </div>
  </div>

  <!-- STEP 3: ROLE-BASED DASHBOARD -->
  <div id="dashboardView" class="admin-layout" style="display:none;">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleAdminSidebar(false)"></div>

    <aside class="admin-sidebar" id="adminSidebar">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:6px 8px 18px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:10px;">
        <div style="display:flex; align-items:center; gap:10px;">
          <img src="assets/images/logo.png" style="width:46px; height:36px; object-fit:contain; border-radius:9px; background:#fff; padding:3px;">
          <div>
            <div style="font-weight:700; color:#fff; font-size:1.05rem;">মহেশখালীয়ান</div>
            <div style="font-size:0.75rem; color:#7df7d4;">এডমিন ড্যাশবোর্ড</div>
          </div>
        </div>
        <button class="mobile-menu-toggle" style="background:rgba(255,255,255,0.1); border:none; color:#fff; width:32px; height:32px;" onclick="toggleAdminSidebar(false)">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="sidebarMenu" style="display:grid; gap:4px;"></div>

      <div style="margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,0.12); display:grid; gap:6px;">
        <a href="index.html" class="side-btn"><span class="side-btn-left"><i class="fa-solid fa-globe"></i> লাইভ সাইট দেখুন</span></a>
        <button class="side-btn" onclick="doAdminLogout()" style="color:#fca5a5;">
          <span class="side-btn-left"><i class="fa-solid fa-power-off" style="color:#fca5a5;"></i> লগআউট</span>
        </button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="mobile-menu-toggle" onclick="toggleAdminSidebar(true)" title="মেনু">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <h3 id="adminPageTitle" style="color:var(--navy); font-size:1.25rem;">ড্যাশবোর্ড ওভারভিউ</h3>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <a href="index.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-up-right-from-square"></i> সাইট</a>
          <div style="display:flex; align-items:center; gap:10px; background:#f4f9f7; padding:6px 12px; border-radius:12px; border:1px solid var(--border);">
            <img id="admUserPhoto" src="assets/images/logo.png" style="width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid var(--primary);">
            <div style="line-height:1.2;">
              <div id="admUserName" style="font-weight:700; font-size:0.9rem; color:var(--navy);"></div>
              <small id="admUserRole" style="color:var(--primary); font-weight:600;"></small>
            </div>
          </div>
        </div>
      </div>

      <div id="adminContent"></div>
    </main>
  </div>

  <!-- Admin Modal -->
  <div class="modal-backdrop" id="adminModal" onclick="if(event.target===this) closeAdmModal()">
    <div class="modal-box">
      <button class="modal-close" onclick="closeAdmModal()"><i class="fa-solid fa-xmark"></i></button>
      <div id="adminModalBody" style="padding:26px;"></div>
    </div>
  </div>

  <div class="toast" id="toastBox"></div>
  <script src="assets/js/seed_data.js?v=6"></script>
  <script src="assets/js/admin.js?v=6"></script>
</body>
</html>
